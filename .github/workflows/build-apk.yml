name: Build Khusphus React Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build React Native APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Generate Direct Download Link via BashUpload
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          echo "Uploading to bashupload.com for instant direct link..."
          UPLOAD_URL=$(curl -s --upload-file "$APK_FILE" https://bashupload.com | grep -o 'https://bashupload.com/[^ ]*' | head -n 1)
          echo "=========================================================="
          echo "DIRECT DOWNLOAD LINK: $UPLOAD_URL"
          echo "=========================================================="
          echo "## 📱 Direct APK Download Link" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to download APK]($UPLOAD_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest-apk
          name: "Khusphus React Native Android APK"
          body: "Official React Native Android build with exact Khusphus UI, WebRTC calling, Audio Spaces, and Moments."
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
